[project]
name = "keba-modbus-client"
version = "0.2.0"
description = "Python client library for communicating with KEBA KeContact wallboxes via Modbus TCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Christian Froemmel", email = "senfomat@gmail.com" },
]
keywords = ["keba", "kecontact", "wallbox", "modbus", "modbus-tcp", "ev-charging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pymodbus>=3.15",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.urls]
Homepage = "https://github.com/senfomat/PythonKebaClient"
"Bug Tracker" = "https://github.com/senfomat/PythonKebaClient/issues"

[project.optional-dependencies]
examples = ["click>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
preview = false

[tool.ruff.lint]
preview = true
select = ["ALL"]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = [
"complex-structure",
"missing-trailing-comma",
"CPY",
"call-datetime-now-without-tzinfo",
"call-datetime-strptime-without-zone",
"line-too-long",
"commented-out-code",
"line-contains-todo",
"PLR",
"TC",
"blind-except",
"D",
"hardcoded-bind-all-interfaces",
"print",
]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["undefined-local-with-import-star"]
"tests/*" = ["assert"]
"examples/*" = ["D", "print"]
